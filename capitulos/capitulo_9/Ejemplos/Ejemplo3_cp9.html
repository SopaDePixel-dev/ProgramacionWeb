<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo 3 - Figura 9.4</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .bloque-salida p {
            margin: 0 0 10px 0;
            color: #1a365d;
            font-weight: bold;
        }

        .bloque-salida ol {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        .bloque-salida li {
            display: inline-block;
            margin-right: 12px;
            margin-bottom: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #333;
        }

        .boton-regresar {
            text-align: center;
        }

        button {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #084d77;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Ejemplo 3 (Figura 9.4)</h2>

        <div class="bloque-salida">
            <script type="text/javascript">
                var valor;

                document.writeln("<p>N&uacute;meros aleatorios</p><ol>");

                for (var i = 1; i <= 30; ++i) {
                    valor = Math.floor(1 + Math.random() * 6);
                    document.writeln("<li>" + valor + "</li>");
                }

                document.writeln("</ol>");
            </script>
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
