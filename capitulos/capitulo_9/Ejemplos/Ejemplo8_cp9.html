<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo 8 - Figura 9.9</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .bloque-salida p {
            margin: 0;
            color: #333;
        }

        .bloque-salida p.espacio {
            margin-top: 10px;
        }

        .boton-regresar {
            text-align: center;
        }

        button {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #084d77;
        }
    </style>
    <script type="text/javascript">
        var salida; // almacena la cadena a mostrar
        var x = 1; // variable global

        function iniciar() {
            var x = 5; // variable local para la función iniciar

            salida = "<p>la x local en iniciar es " + x + "</p>";

            funcionA(); // funcionA tiene la x local
            funcionB(); // funcionB usa la variable global x
            funcionA(); // funcionA reinicializa la x local
            funcionB(); // la variable global x retiene su valor

            salida += "<p class='espacio'>la x local en iniciar es " + x + "</p>";
            document.getElementById("resultados").innerHTML = salida;
        } // fin de la función iniciar

        function funcionA() {
            var x = 25; // se inicializa cada vez que se llama a la funcionA

            salida += "<p class='espacio'>la x local en la funcionA es " + x + 
                      " despu&eacute;s de entrar a funcionA</p>";
            ++x;
            salida += "<p>la x local en funcionA es " + x + 
                      " antes de salir de funcionA</p>";
        } // fin de funcionA

        function funcionB() {
            salida += "<p class='espacio'>la variable global x es " + x + 
                      " al entrar a la funcionB</p>";
            x *= 10;
            salida += "<p>la variable global x es " + x + 
                      " al salir de la funcionB</p>";
        } // fin de la funcionB

        window.addEventListener("load", iniciar, false);
    </script>
</head>
<body>

    <div class="contenedor">
        <h2>Ejemplo 8 (Figura 9.9)</h2>

        <div class="bloque-salida">
            <div id="resultados"></div>
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
