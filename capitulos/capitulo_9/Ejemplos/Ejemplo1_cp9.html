<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo 1 - Figura 9.2</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        .bloque-salida h3 {
            color: #1a365d;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .bloque-salida p {
            margin: 4px 0;
            color: #333;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .boton-regresar {
            text-align: center;
        }

        button {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #084d77;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Ejemplo 1 (Figura 9.2)</h2>

        <div class="bloque-salida">
            <h3>Obtener el cuadrado de los números del 1 al 10</h3>
            <script type="text/javascript">
                // Obtener el cuadrado de los números del 1 al 10
                for (var x = 1; x <= 10; ++x) {
                    document.writeln("<p>El cuadrado de " + x + " es " + cuadrado(x) + "</p>");
                }

                // Definición de la función cuadrado
                function cuadrado(y) {
                    return y * y;
                }
            </script>
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
