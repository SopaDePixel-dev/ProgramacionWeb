<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Actividad 9.19 - Números Primos (1 a 10,000)</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-modo {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-weight: bold;
        }

        .btn-modo:hover {
            background-color: #084d77;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        .info-rendimiento {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #1a365d;
            font-weight: bold;
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .explicacion-teórica {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.5;
        }

        .boton-regresar {
            text-align: center;
        }

        .btn-regresar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-regresar:hover {
            background-color: #084d77;
        }
    </style>
    <script type="text/javascript">
        function esPrimoN2(n) {
            if (n <= 1) return false;
            var limite = Math.floor(n / 2);
            for (var i = 2; i <= limite; i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function esPrimoRaiz(n) {
            if (n <= 1) return false;
            var limite = Math.floor(Math.sqrt(n));
            for (var i = 2; i <= limite; i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function calcularPrimos(usarRaiz) {
            var txtArea = document.getElementById("areaPrimos");
            var divRend = document.getElementById("divRendimiento");
            
            txtArea.value = "Calculando...";
            
            setTimeout(function() {
                var inicio = performance.now();
                var primos = [];
                var totalProbados = 0;

                for (var i = 1; i <= 10000; i++) {
                    totalProbados++;
                    if (usarRaiz) {
                        if (esPrimoRaiz(i)) primos.push(i);
                    } else {
                        if (esPrimoN2(i)) primos.push(i);
                    }
                }

                var fin = performance.now();
                var tiempoMs = (fin - inicio).toFixed(2);

                txtArea.value = primos.join(", ");
                var metodoNombre = usarRaiz ? "Límite con raíz cuadrada (√n)" : "Límite con división n/2";
                divRend.innerHTML = "Método: " + metodoNombre + "<br>Encontrados: " + primos.length + " primos | Tiempo: " + tiempoMs + " ms";
            }, 50);
        }

        function iniciar() {
            document.getElementById("btnN2").addEventListener("click", function() { calcularPrimos(false); }, false);
            document.getElementById("btnRaiz").addEventListener("click", function() { calcularPrimos(true); }, false);
        }

        window.addEventListener("load", iniciar, false);
    </script>
</head>
<body>

    <div class="contenedor">
        <h2>Actividad 9.19</h2>

        <div class="bloque-salida">
            <div class="grid-botones">
                <input id="btnN2" class="btn-modo" type="button" value="Calcular con n/2">
                <input id="btnRaiz" class="btn-modo" type="button" value="Calcular con √n (Math.sqrt)">
            </div>

            <textarea id="areaPrimos" readonly placeholder="Presione un botón para calcular los números primos del 1 al 10,000..."></textarea>

            <div id="divRendimiento" class="info-rendimiento">Seleccione un método de cálculo.</div>

            <p class="explicacion-teórica">
                <strong>¿Por qué solo hasta √n?</strong> Si <i>n</i> tiene un divisor mayor que √<i>n</i>, necesariamente debe existir otro divisor correspondiente menor o igual a √<i>n</i>. Probar más allá de √<i>n</i> es redundante.
            </p>
        </div>

        <div class="boton-regresar">
            <a href="index_Actividades.html">
                <button type="button" class="btn-regresar">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
