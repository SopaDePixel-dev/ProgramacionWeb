<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Actividad 9.30 - Análisis de Función Misterio</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explicacion-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .explicacion-box h4 {
            margin-top: 0;
            color: #1a365d;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-grupo label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #1a365d;
            font-size: 0.9rem;
        }

        .form-grupo input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-probar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            font-weight: bold;
        }

        .btn-probar:hover {
            background-color: #084d77;
        }

        .resultado-cuadro {
            margin-top: 15px;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.05rem;
            color: #1a365d;
            font-weight: bold;
            text-align: center;
        }

        .boton-regresar {
            text-align: center;
        }

        .btn-regresar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-regresar:hover {
            background-color: #084d77;
        }
    </style>
    <script type="text/javascript">
        function misterio(a, b) {
            if (b === 1) {
                return a;
            } else {
                return a + misterio(a, b - 1);
            }
        }

        function probarMisterio() {
            var valA = parseInt(document.getElementById("numA").value);
            var valB = parseInt(document.getElementById("numB").value);
            var divRes = document.getElementById("divResultado");

            if (isNaN(valA) || isNaN(valB) || valB < 1) {
                divRes.innerHTML = "<span style='color: #c53030;'>Ingrese enteros válidos (b debe ser ≥ 1).</span>";
                return;
            }

            var res = misterio(valA, valB);
            divRes.innerHTML = "misterio(" + valA + ", " + valB + ") = <strong>" + res + "</strong>";
        }

        function iniciar() {
            document.getElementById("btnProbar").addEventListener("click", probarMisterio, false);
        }

        window.addEventListener("load", iniciar, false);
    </script>
</head>
<body>

    <div class="contenedor">
        <h2>Actividad 9.30</h2>

        <div class="bloque-salida">
            <div class="explicacion-box">
                <h4>¿Qué hace esta función?</h4>
                <p>La función <code>misterio(a, b)</code> calcula la <strong>multiplicación entera de a × b</strong> mediante sumas sucesivas recursivas[cite: 32]. Suma el valor de <code>a</code> a sí mismo un total de <code>b</code> veces hasta llegar al caso base (<code>b == 1</code>)[cite: 32].</p>
            </div>

            <form action="#" onsubmit="return false;">
                <div class="grid-inputs">
                    <div class="form-grupo">
                        <label for="numA">Valor de a:</label>
                        <input id="numA" type="number" step="1" placeholder="Ej. 5">
                    </div>
                    <div class="form-grupo">
                        <label for="numB">Valor de b (entero ≥ 1):</label>
                        <input id="numB" type="number" step="1" min="1" placeholder="Ej. 4">
                    </div>
                </div>

                <input id="btnProbar" class="btn-probar" type="button" value="Ejecutar Función Misterio">
            </form>

            <div id="divResultado" class="resultado-cuadro">Ingrese los valores para probar.</div>
        </div>

        <div class="boton-regresar">
            <a href="index_Actividades.html">
                <button type="button" class="btn-regresar">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
