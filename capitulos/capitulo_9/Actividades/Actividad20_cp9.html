<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Actividad 9.20 - Puntos de Calidad Académicos</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 25px 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: center;
        }

        .form-grupo {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-grupo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1a365d;
        }

        .form-grupo input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-evaluar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            font-weight: bold;
        }

        .btn-evaluar:hover {
            background-color: #084d77;
        }

        .resultado-cuadro {
            margin-top: 20px;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.05rem;
            color: #1a365d;
            font-weight: bold;
        }

        .boton-regresar {
            text-align: center;
        }

        .btn-regresar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-regresar:hover {
            background-color: #084d77;
        }
    </style>
    <script type="text/javascript">
        function puntosCalidad(promedio) {
            if (promedio >= 90 && promedio <= 100) return 4;
            if (promedio >= 80 && promedio <= 89) return 3;
            if (promedio >= 70 && promedio <= 79) return 2;
            if (promedio >= 60 && promedio <= 69) return 1;
            return 0;
        }

        function evaluarPromedio() {
            var campo = document.getElementById("campoPromedio");
            var promedio = parseFloat(campo.value);
            var divRes = document.getElementById("divResultado");

            if (isNaN(promedio) || promedio < 0 || promedio > 100) {
                divRes.innerHTML = "<span style='color: #c53030;'>Ingrese un promedio válido entre 0 y 100.</span>";
                return;
            }

            var puntos = puntosCalidad(promedio);
            divRes.innerHTML = "Promedio: " + promedio + " ➔ Puntos de Calidad: <strong>" + puntos + "</strong>";
        }

        function iniciar() {
            document.getElementById("btnEvaluar").addEventListener("click", evaluarPromedio, false);
        }

        window.addEventListener("load", iniciar, false);
    </script>
</head>
<body>

    <div class="contenedor">
        <h2>Actividad 9.20</h2>

        <div class="bloque-salida">
            <form action="#" onsubmit="return false;">
                <div class="form-grupo">
                    <label for="campoPromedio">Promedio del estudiante (0 - 100):</label>
                    <input id="campoPromedio" type="number" step="any" min="0" max="100" placeholder="Ej. 85.5">
                </div>
                <input id="btnEvaluar" class="btn-evaluar" type="button" value="Calcular Puntos de Calidad">
            </form>

            <div id="divResultado" class="resultado-cuadro">Ingrese el promedio para evaluar.</div>
        </div>

        <div class="boton-regresar">
            <a href="index_Actividades.html">
                <button type="button" class="btn-regresar">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
