<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Actividad 9.24 - Monitoreo de Rendimiento (10 Preguntas)</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 25px 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: center;
        }

        .pregunta-titulo {
            font-size: 1.3rem;
            color: #1a365d;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .contador-preguntas {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .form-grupo {
            margin-bottom: 15px;
        }

        .form-grupo input[type="number"] {
            width: 80%;
            padding: 10px;
            font-size: 1.1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-responder {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 80%;
            font-weight: bold;
        }

        .btn-responder:hover {
            background-color: #084d77;
        }

        .mensaje-respuesta {
            margin-top: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            min-height: 24px;
        }

        .boton-regresar {
            text-align: center;
        }

        .btn-regresar {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-regresar:hover {
            background-color: #084d77;
        }
    </style>
    <script type="text/javascript">
        var num1;
        var num2;
        var respuestaCorrecta;
        var totalPreguntas = 0;
        var respuestasCorrectas = 0;
        var primerIntentoPregunta = true;

        function reiniciarCuestionario() {
            totalPreguntas = 0;
            respuestasCorrectas = 0;
            generarNuevaPregunta();
        }

        function generarNuevaPregunta() {
            if (totalPreguntas === 10) {
                evaluarRendimiento();
                return;
            }

            primerIntentoPregunta = true;
            num1 = Math.floor(1 + Math.random() * 9);
            num2 = Math.floor(1 + Math.random() * 9);
            respuestaCorrecta = num1 * num2;

            document.getElementById("divPregunta").innerText = "¿Cuánto es " + num1 + " por " + num2 + "?";
            document.getElementById("divContador").innerText = "Pregunta " + (totalPreguntas + 1) + " de 10";
            document.getElementById("campoRespuesta").value = "";
            document.getElementById("campoRespuesta").disabled = false;
            document.getElementById("btnResponder").disabled = false;
            document.getElementById("campoRespuesta").focus();
        }

        function obtenerMensajeCorrecto() {
            var opcion = Math.floor(1 + Math.random() * 4);
            switch (opcion) {
                case 1: return "¡Muy bien!";
                case 2: return "¡Excelente!";
                case 3: return "¡Buen trabajo!";
                case 4: return "¡Siga así!";
            }
        }

        function obtenerMensajeIncorrecto() {
            var opcion = Math.floor(1 + Math.random() * 4);
            switch (opcion) {
                case 1: return "No. Intente de nuevo.";
                case 2: return "Equivocado. Trate una vez más.";
                case 3: return "¡No se dé por vencido!";
                case 4: return "No. Siga intentando.";
            }
        }

        function verificarRespuesta() {
            var campo = document.getElementById("campoRespuesta");
            var resUsuario = parseInt(campo.value);
            var divMensaje = document.getElementById("divMensaje");

            if (isNaN(resUsuario)) {
                divMensaje.innerHTML = "<span style='color: #c53030;'>Escriba un número.</span>";
                return;
            }

            if (resUsuario === respuestaCorrecta) {
                if (primerIntentoPregunta) {
                    respuestasCorrectas++;
                }
                totalPreguntas++;

                divMensaje.innerHTML = "<span style='color: #15803d;'>" + obtenerMensajeCorrecto() + "</span>";
                setTimeout(function() {
                    divMensaje.innerText = "";
                    generarNuevaPregunta();
                }, 1200);
            } else {
                primerIntentoPregunta = false;
                divMensaje.innerHTML = "<span style='color: #c53030;'>" + obtenerMensajeIncorrecto() + "</span>";
                campo.value = "";
                campo.focus();
            }
        }

        function evaluarRendimiento() {
            var porcentaje = (respuestasCorrectas / 10) * 100;
            var divPregunta = document.getElementById("divPregunta");
            var divContador = document.getElementById("divContador");
            var divMensaje = document.getElementById("divMensaje");

            document.getElementById("campoRespuesta").disabled = true;
            document.getElementById("btnResponder").disabled = true;

            divPregunta.innerText = "Evaluación Finalizada";
            divContador.innerText = "Puntuación: " + respuestasCorrectas + " de 10 (" + porcentaje + "%)";

            if (porcentaje < 75) {
                divMensaje.innerHTML = "<span style='color: #c53030;'>Pida ayuda adicional a su instructor.</span><br><br><button onclick='reiniciarCuestionario()' style='padding: 8px 16px; cursor: pointer;'>Reiniciar cuestionario</button>";
            } else {
                divMensaje.innerHTML = "<span style='color: #15803d;'>¡Felicidades, está listo para pasar al siguiente nivel!</span><br><br><button onclick='reiniciarCuestionario()' style='padding: 8px 16px; cursor: pointer;'>Iniciar nuevo intento</button>";
            }
        }

        function iniciar() {
            document.getElementById("btnResponder").addEventListener("click", verificarRespuesta, false);
            generarNuevaPregunta();
        }

        window.addEventListener("load", iniciar, false);
    </script>
</head>
<body>

    <div class="contenedor">
        <h2>Actividad 9.24</h2>

        <div class="bloque-salida">
            <div id="divContador" class="contador-preguntas">Pregunta 1 de 10</div>
            <div id="divPregunta" class="pregunta-titulo">Cargando pregunta...</div>

            <form action="#" onsubmit="return false;">
                <div class="form-grupo">
                    <input id="campoRespuesta" type="number" step="1" placeholder="Tu respuesta">
                </div>
                <input id="btnResponder" class="btn-responder" type="button" value="Enviar Respuesta">
            </form>

            <div id="divMensaje" class="mensaje-respuesta"></div>
        </div>

        <div class="boton-regresar">
            <a href="index_Actividades.html">
                <button type="button" class="btn-regresar">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
