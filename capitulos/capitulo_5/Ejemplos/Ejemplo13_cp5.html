<!DOCTYPE html>

<!-- Fig. 5.14: fusionarimagenes.html -->
<!-- Fusionar una imagen en otra mediante CSS3. -->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Ejemplo 13</title>
        <style type = "text/css">
            #portada
            {
                position: relative;
                margin: 0 auto;
            }
            #portada img
            {
                position: absolute;
                left: 0;
                -webkit-transition: opacity 4s ease-in-out;
                transition: opacity 4s ease-in-out;
            }
            #portada img.top:hover
            { opacity:0; }

            .boton-regresar
            {
                position: relative;
                margin-top: 250px;
                clear: both;
            }
        </style>
    </head>
    <body>
        <div id= "portada">
            <img class = "bottom" src = "jhtp.png" alt = "Portada de Java 9e">
            <img class = "top" src = "jhtp8.png" alt = "Portada de Java 8e">
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </body>
</html>
