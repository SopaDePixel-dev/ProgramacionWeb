<!DOCTYPE html>

<!-- Fig. 5.13: inclinar.html -->
<!-- Elementos de inclinación y de transformación en CSS3. -->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Ejemplo 12</title>
        <style type = "texto/css">
            .skew .textbox
            {
                margin-left: 75px;
                background: lightgreen;
                height: 100px;
                width: 200px;
                padding: 25px 0;
                text-align: center;
                font-size: 250%;
                border: 3px solid DarkGreen;
                border-radius: 15px;
                -webkit-animation: skew 3s infinite linear;
                -moz-animation: skew 3s infinite linear;
                animation: skew 3s infinite linear;
            }
            @keyframes skew
            {
                from { transform: skewX(0deg); }
                25%  { transform: skewX(45deg); }
                50%  { transform: skewX(0); }
                75%  { transform: skewX(-45deg); }
                to   { transform: skewX(0); }
            }
            .boton-regresar
            {
                margin-top: 50px;
                margin-left: 75px;
                clear: both;
            }
        </style>
    </head>
    <body>
        <div class = "box skew">
            <div class = "textbox">Inclinar texto</div>
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </body>
</html>
