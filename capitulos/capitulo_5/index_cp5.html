<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: #2b5b84;
            border-bottom: 2px solid #2b5b84;
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .menu-navegacion {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .enlace-seccion {
            display: block;
            text-decoration: none;
            color: #1a5b8c;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 20px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .enlace-seccion:hover {
            background-color: #f8fafc;
            color: #0b69a3;
            border-color: #0b69a3;
        }

        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 25px 0;
        }

        .acciones {
            text-align: center;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Capítulo 5</h1>

        <div class="menu-navegacion">
            <a href="Actividades/index_Actividades.html" class="enlace-seccion">
                Actividades
            </a>
            <a href="Ejemplos/index_Ejemplos.html" class="enlace-seccion">
                Ejemplos
            </a>
        </div>

        <hr>

        <div class="acciones">
            <a href="../../index.html" style="text-decoration: none;">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
