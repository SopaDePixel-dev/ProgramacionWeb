<!DOCTYPE html>

<!-- Ejemplo 5 Cap 4 -->
<!-- Fig 4.9: posicionamiento.html -->
<!-- Posicionamiento absoluto de los elementos. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Posicionamiento absoluto</title>
    <style type="text/css">
        .imagen_fondo {
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 1;
        }
        .imagen_primerplano {
            position: absolute;
            top: 25px;
            left: 100px;
            z-index: 2;
        }
        .texto {
            position: absolute;
            top: 25px;
            left: 100px;
            z-index: 3;
            font-size: 20pt;
            font-family: tahoma, geneva, sans-serif;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <p><img src="https://placehold.co/400x300/222222/cccccc.png?text=Fondo" class="imagen_fondo"
        alt="Primera imagen posicionada" /></p>

    <p><img src="https://placehold.co/250x150/007acc/ffffff.png?text=Primer+Plano" class="imagen_primerplano"
        alt="Segunda imagen posicionada" /></p>

    <p class="texto">Texto posicionado</p>
        <hr>
    <a href="index_Ejemplos.html">
        <p>Regresar al índice de ejemplos</p>
    </a>
</body>
</html>
