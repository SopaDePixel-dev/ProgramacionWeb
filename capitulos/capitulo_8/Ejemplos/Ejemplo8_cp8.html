<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo 8 - Capítulo 8</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor h2 {
            color: #333333;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .salida-ejemplo {
            margin: 25px 0;
            font-size: 1.1rem;
            color: #1a365d;
        }

        .salida-ejemplo p {
            font-weight: bold;
            margin-top: 15px;
        }

        .boton-regresar {
            margin-top: 30px;
        }

        button {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #084d77;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Ejemplo 8</h2>

        <div class="salida-ejemplo">
            <script type="text/javascript">
                for (var cuenta = 1; cuenta <= 10; ++cuenta) {
                    if (cuenta == 5) {
                        continue; // omite el resto del código del ciclo sólo si cuenta == 5
                    }

                    document.writeln(cuenta + " ");
                } // fin de for

                document.writeln(
                    "<p>Se us&oacute; continue para no imprimir el 5</p>"
                );
            </script>
        </div>

        <div class="boton-regresar">
            <a href="index_Ejemplos.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
