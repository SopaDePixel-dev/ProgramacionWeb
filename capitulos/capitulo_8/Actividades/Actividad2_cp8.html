<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Actividad 2 - Ejercicio 8.2</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .contenedor {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: left;
        }

        .contenedor h2 {
            color: #1a365d;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .reactivo {
            background-color: #f1f5f9;
            border-left: 4px solid #0b69a3;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .reactivo p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .enunciado {
            font-weight: bold;
            color: #1a365d;
            margin-bottom: 8px !important;
        }

        .resultado {
            color: #0b69a3;
            font-weight: bold;
        }

        .bloque-salida {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin-top: 8px;
        }

        .bloque-salida p {
            margin: 4px 0;
            color: #333;
            font-family: monospace;
            font-size: 1rem;
        }

        .boton-regresar {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #084d77;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Actividad 2 (Ejercicio 8.2)</h2>

        <div class="reactivo">
            <p class="enunciado">a) Sumar los enteros impares entre 1 y 99 con un ciclo for:</p>
            <div class="bloque-salida">
                <script type="text/javascript">
                    var suma = 0;
                    var cuenta;

                    for (cuenta = 1; cuenta <= 99; cuenta += 2) {
                        suma += cuenta;
                    }

                    document.writeln("<p class='resultado'>La suma de los impares del 1 al 99 es: " + suma + "</p>");
                </script>
            </div>
        </div>

        <div class="reactivo">
            <p class="enunciado">b) Calcular 2.5 elevado a la potencia 3 usando Math.pow:</p>
            <div class="bloque-salida">
                <script type="text/javascript">
                    var resultado = Math.pow(2.5, 3);
                    document.writeln("<p class='resultado'>2.5<sup>3</sup> = " + resultado + "</p>");
                </script>
            </div>
        </div>

        <div class="reactivo">
            <p class="enunciado">c) Imprimir enteros del 1 al 20 (5 por línea) con ciclo while:</p>
            <div class="bloque-salida">
                <script type="text/javascript">
                    var x;
                    x = 1;
                    document.writeln("<p>");

                    while (x <= 20) {
                        document.writeln(x + " ");
                        if (x % 5 === 0) {
                            document.writeln("</p><p>");
                        }
                        ++x;
                    }
                    document.writeln("</p>");
                </script>
            </div>
        </div>

        <div class="reactivo">
            <p class="enunciado">d) Imprimir enteros del 1 al 20 (5 por línea) con ciclo for:</p>
            <div class="bloque-salida">
                <script type="text/javascript">
                    var x;
                    document.writeln("<p>");

                    for (x = 1; x <= 20; ++x) {
                        document.writeln(x + " ");
                        if (x % 5 === 0) {
                            document.writeln("</p><p>");
                        }
                    }
                    document.writeln("</p>");
                </script>
            </div>
        </div>

        <div class="boton-regresar">
            <a href="index_Actividades.html">
                <button type="button">Regresar</button>
            </a>
        </div>
    </div>

</body>
</html>
