<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Capítulo 7</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .tarjeta {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #2b5b84;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .linea-separadora {
            border: none;
            border-top: 2px solid #2b5b84;
            margin-bottom: 30px;
        }

        .linea-suave {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 30px 0;
        }

        .boton-opcion {
            display: block;
            width: 70%;
            margin: 15px auto;
            padding: 12px 0;
            background-color: #ffffff;
            color: #1a5b8c;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .boton-opcion:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .boton-regresar {
            background-color: #6c757d;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .boton-regresar:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>Capítulo 7</h1>
        <hr class="linea-separadora">

        <a href="Actividades/index_actividades.html" class="boton-opcion">Actividades</a>
        <a href="Ejemplos/index_Ejemplos.html" class="boton-opcion">Ejemplos</a>

        <hr class="linea-suave">

        <a href="../../index.html" class="boton-regresar">Regresar</a>
    </div>

</body>
</html>
